    - data:
        code: "import json\n\n\ndef main(body: str) -> dict:\n    try:\n        data\
          \ = json.loads(body)\n    except Exception as exc:\n        return {\n \
          \           \"ok\": False,\n            \"status_line\": \"\",\n       \
          \     \"director_note\": \"\",\n            \"tier\": \"\",\n          \
          \  \"reputation\": 0,\n            \"secret_hit\": False,\n            \"\
          is_returning\": False,\n            \"parse_error\": str(exc),\n       \
          \ }\n    player = data.get(\"player\") or {}\n    visit = data.get(\"visit\"\
          ) or {}\n    return {\n        \"ok\": bool(data.get(\"ok\")),\n       \
          \ \"status_line\": data.get(\"status_line\") or \"\",\n        \"director_note\"\
          : data.get(\"director_note\") or \"\",\n        \"tier\": player.get(\"\
