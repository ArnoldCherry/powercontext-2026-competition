    - data:
        desc: 把小二的听辨结果拆成行为、关键词和名号，交账房检索。
        instruction: '你是「不二客栈」里跑堂的小二，只负责听客人的话并传话，不回答客人。

          从下面这句话里提取三样东西：

          1. action：客人的行为，只能从这些词里选一个：请安、点菜、请客、吹牛、叙旧、打听、赊账、还账、捣乱、威胁、偷窃。实在判断不了填「叙旧」。

          2. keywords：客人提到的人、物、地点、话题，最多 4 个，用空格分隔。没有就填「无」。

          3. player_name：客人自报的名号（如“我叫令狐冲”“叫我冲哥”），没有就填「无」。

          只做提取，不要回答问题，不要编造客人没说的内容。'
        model:
          completion_params:
            temperature: 0.1
            thinking: false
          mode: chat
          name: deepseek-flash
          provider: langgenius/deepseek/deepseek
        parameters:
        - description: 行为类别，必须是请安、点菜、请客、吹牛、叙旧、打听、赊账、还账、捣乱、威胁、偷窃之一
          name: action
          required: true
          type: string
        - description: 用于检索江湖异闻的关键词，最多4个，空格分隔，没有填「无」
          name: keywords
          required: false
          type: string
        - description: 客人自报的名号，没有填「无」
          name: player_name
          required: false
          type: string
        query:
