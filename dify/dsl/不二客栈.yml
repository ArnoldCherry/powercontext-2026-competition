    - data:
        code: "import re\n\n\ndef main(text: str, status_line: str) -> dict:\n   \
          \ cleaned = re.sub(r\"\\s*【人情[^】]*】\\s*$\", \"\", text or \"\").strip()\n\
          \    body = f\"{cleaned}\\n\\n{status_line}\".strip() if status_line else\
          \ cleaned\n    return {\"reply\": body}"
        code_language: python3
        desc: 去掉掌柜重复写出的状态标记，统一追加账本里的准确状态。
