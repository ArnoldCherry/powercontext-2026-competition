services:
  inn-backend:
    build:
      context: ./inn-backend
    image: inn-backend:local
    restart: always
    environment:
      SEEKDB_HOST: seekdb
      SEEKDB_PORT: "2881"
      SEEKDB_USER: root
      SEEKDB_PASSWORD: ${OCEANBASE_VECTOR_PASSWORD:?set OCEANBASE_VECTOR_PASSWORD}
      SEEKDB_DATABASE: inn
      INN_ADMIN_TOKEN: ${INN_ADMIN_TOKEN:?set INN_ADMIN_TOKEN}
    ports:
      - "${INN_BACKEND_PORT:-8000}:8000"
    depends_on:
      seekdb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - default
